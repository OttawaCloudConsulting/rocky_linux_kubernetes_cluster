# Kubernetes Installation Configuration
# This file contains shared variables used by both control plane and worker installation scripts
# Source this file in your scripts with: source ./k8s-config.conf

# Logging configuration
LOG_FILE="/var/log/k8s_install.log"

# Container Runtime Versions
CONTAINERD_VERSION="2.1.4"
RUNC_VERSION="v1.3.1"
CNI_PLUGINS_VERSION="1.8.0"

# Kubernetes Versions
K8S_VERSION_MINOR="1.34"
K8S_VERSION_PATCH="1.34.0"

# Installation Paths
CONTAINERD_BIN="/usr/local/bin/containerd"

# Kubeadm Configuration File
K8_INIT_FILE="kubeadm-config.yaml"
KUBECONFIG="/etc/kubernetes/admin.conf"

# Firewall Configuration
FIREWALLD_FILE="firewalld/k8s-controlplane.xml"
FIREWALLD_WORKER_FILE="firewalld/k8s-worker.xml"

# Network Configuration
POD_SUBNET="192.168.0.0/16"

# File Limits Configuration
NOFILE_LIMIT="1048576"

# System Configuration
SELINUX_MODE="permissive"
