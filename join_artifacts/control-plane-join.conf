# control-plane-join.conf
# Configuration file for joining additional control-plane nodes to the Kubernetes cluster
# This file must be sourced by the install_k8_additional_control_plane.sh script
#
# IMPORTANT: Generate these values from the PRIMARY control-plane node before using this file.
# See README.md in this directory for instructions on how to generate these values.

# Primary control-plane endpoint (IP:PORT or HOSTNAME:PORT)
# This should point to the first control-plane node or load balancer
# Example: 192.168.1.100:6443
CONTROL_PLANE_ENDPOINT="<PRIMARY_CONTROL_PLANE_IP>:6443"

# Kubeadm join token
# Generated with: kubeadm token create
# Note: Tokens expire after 24 hours by default
# Example: abcdef.0123456789abcdef
JOIN_TOKEN="<KUBEADM_JOIN_TOKEN>"

# CA Certificate Hash (SHA256)
# Generated with: openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
# Example: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
CA_CERT_HASH="<CA_CERTIFICATE_HASH>"

# Certificate Key
# Generated with: kubeadm init phase upload-certs --upload-certs
# Note: Certificate keys expire after 2 hours by default
# Example: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
CERTIFICATE_KEY="<CERTIFICATE_KEY>"
