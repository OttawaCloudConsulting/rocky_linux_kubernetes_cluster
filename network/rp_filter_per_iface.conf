# Per-interface rp_filter override manifest
# Source of truth for /etc/sysctl.d/99-occ-vlan-rp_filter.conf
#
# Closes the VLAN43 RPF pathology surfaced by the OCC VLAN43 Diagnostic
# Validation Campaign (predecessor PRD), and applied by the VLAN43
# Remediation Apply Campaign:
#   docs/problems/vlan43-error/apply/prd.md §Configuration (Required)
#   docs/problems/vlan43-error/apply/architecture.md Decision #1, #2
#
# Lookup key is node_type as parsed by setup_interfaces.sh::parse_hostname()
# from the system hostname (e.g. occ-cs-k8control-plane02 -> "control-plane";
# occ-cs-k8worker00 -> "worker").
#
# Per-host overrides (RPF_HOST_IFACES / RPF_HOST_VLANS, keyed by full hostname)
# take precedence when set. They are intentionally empty in the homelab today;
# add entries only if a future node deviates from the node_type defaults.
#
# Format: bash associative arrays. Values are space-separated lists.
# VLAN ordering follows PRD §Configuration key lists exactly (43 outer first,
# 41 inner second on workers) so the generator emits a stable byte-exact file.

declare -A RPF_NODE_TYPE_IFACES=(
    ["control-plane"]="enp1s0 enp2s0"
    ["worker"]="eno1 enp5s0"
)

declare -A RPF_NODE_TYPE_VLANS=(
    ["control-plane"]="43"
    ["worker"]="43 41"
)

declare -A RPF_HOST_IFACES=()
declare -A RPF_HOST_VLANS=()

RPF_PERSISTENCE_FILE="/etc/sysctl.d/99-occ-vlan-rp_filter.conf"
RPF_FILE_OWNER="root:root"
RPF_FILE_MODE="0644"
RPF_FILE_SELINUX_CONTEXT="system_u:object_r:system_conf_t:s0"
