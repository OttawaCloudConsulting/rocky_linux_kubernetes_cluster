# Network Interface Configuration for Kubernetes Nodes
# This file contains all configurable parameters for the setup_interfaces.sh script

### ===== Hostname Configuration =====
# Prefix for hostname matching (e.g., "occ-cs-k8" for hostnames like occ-cs-k8worker01)
HOSTNAME_PREFIX="occ-cs-k8"

### ===== Network Interface Configuration =====
# Primary trunked NIC connected to UniFi VLAN trunk
PARENT_IF="eno1"
# Secondary NIC (will be configured with static IP based on node type)
SECOND_IF="enp5s0"

### ===== VLAN Configuration with IP Assignments =====
# VLAN definitions with their network configurations
# Format: "NETWORK_CIDR_TEMPLATE:GATEWAY:DNS"
declare -A VLAN_CONFIGS=(
    ["1"]="10.10.0.{}/24:10.10.0.1:10.10.0.1"
    ["10"]="10.10.1.{}/24:10.10.1.1:10.10.1.1"
    ["30"]="10.30.1.{}/24:10.30.1.1:10.30.1.1"
    ["41"]="10.40.1.{}/24:10.40.1.1:10.40.1.1"
    ["43"]="10.40.3.{}/24:10.40.3.1:10.40.3.1"
    ["44"]="10.40.4.{}/24:10.40.4.1:10.40.4.1"
)

# All VLANs to configure (will be assigned IPs based on VLAN_CONFIGS)
ALL_VLANS=("1" "10" "30" "41" "43" "44")

# Management VLAN ID for cluster communication (primary VLAN with default route)
MGMT_VLAN_ID="44"

### ===== IP Address Configuration =====
# Management network CIDR template - {} will be replaced with calculated octet
MANAGEMENT_CIDR="10.40.4.{}/24"
# Default gateway for the management network
GATEWAY_IP="10.40.4.1"
# DNS servers (space-separated)
DNS_SERVERS="10.40.1.53 10.40.4.1"

### ===== Node Type IP Allocation Rules =====
# Base IP octets for different node types (last digit of hostname will be added)
# Worker nodes: primary = 30 + last_digit, secondary = 40 + last_digit
WORKER_PRIMARY_BASE=30
WORKER_SECONDARY_BASE=40
# Control-plane nodes: primary = 10 + last_digit, secondary = 20 + last_digit
CONTROL_PLANE_PRIMARY_BASE=10
CONTROL_PLANE_SECONDARY_BASE=20

### ===== Advanced Configuration =====
# Whether to remove existing DHCP configuration on secondary interface
REMOVE_DHCP_ON_SECOND="yes"
# Enable verbose logging
VERBOSE_LOGGING="yes"

### ===== Legacy Configuration (for backward compatibility) =====
# These are maintained for existing script compatibility
EXTRA_VLANS=("1" "10" "30" "41" "43")
