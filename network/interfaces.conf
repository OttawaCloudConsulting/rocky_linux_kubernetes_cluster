# Network Interface Configuration for Kubernetes Nodes
# This file contains all configurable parameters for the setup_interfaces.sh script
#
# Post-bonding (campaign: docs/host-network-bonding/ — F-9):
#   - Each node provisions a single `bond0` NM bond connection (active-backup),
#     with PARENT_IF (primary) and SECOND_IF (backup) enslaved to it.
#   - VLAN sub-interfaces are stacked on `bond0` (e.g. bond0.43), not on the
#     raw parent NICs. There is exactly one IP per VLAN per node.

### ===== Hostname Configuration =====
# Prefix for hostname matching (e.g., "occ-cs-k8" for hostnames like occ-cs-k8worker01)
HOSTNAME_PREFIX="occ-cs-k8"

### ===== Network Interface Configuration =====
# PARENT_IF: primary bond member; carries traffic in steady state.
# SECOND_IF: backup bond member; activated by the bond on primary failure.
# After F-9, neither carries an IP directly — both are enslaved to bond0.
PARENT_IF="eno1"
SECOND_IF="enp5s0"

### ===== Bond Configuration =====
# Bond device + active-backup options. Values are load-bearing: fail_over_mac=none
# keeps the bond MAC pinned to PARENT_IF so the announcer-MAC == egress-MAC
# invariant Cilium L2 announcement relies on; num_grat_arp=5 primes the UDM
# neighbor cache on failover.
BOND_IF="bond0"
BOND_MODE="active-backup"
BOND_MIIMON=100
BOND_FAIL_OVER_MAC="none"
BOND_NUM_GRAT_ARP=5
BOND_PRIMARY_RESELECT="always"

### ===== VLAN Configuration with IP Assignments =====
# VLAN definitions with their network configurations
# Format: "NETWORK_CIDR_TEMPLATE:GATEWAY:DNS"
declare -A VLAN_CONFIGS=(
    ["1"]="10.10.0.{}/24:10.10.0.1:10.10.0.1"
    ["10"]="10.10.1.{}/24:10.10.1.1:10.10.1.1"
    ["30"]="10.30.1.{}/24:10.30.1.1:10.30.1.1"
    ["41"]="10.40.1.{}/24:10.40.1.1:10.40.1.1"
    ["43"]="10.40.3.{}/24:10.40.3.1:10.40.3.1"
    ["44"]="10.40.4.{}/24:10.40.4.1:10.40.4.1"
)

# All VLANs to configure (will be assigned IPs based on VLAN_CONFIGS)
ALL_VLANS=("1" "10" "30" "41" "43" "44")

# Management VLAN ID for cluster communication (primary VLAN with default route)
MGMT_VLAN_ID="44"

### ===== IP Address Configuration =====
# Management network CIDR template - {} will be replaced with calculated octet
MANAGEMENT_CIDR="10.40.4.{}/24"
# Default gateway for the management network
GATEWAY_IP="10.40.4.1"
# DNS servers (space-separated)
DNS_SERVERS="10.40.1.53 10.40.4.1"

### ===== Node Type IP Allocation Rules =====
# Base IP octet for each node type (last digit of hostname is added).
# This is the bond0.<vlan> address — there is no longer a per-NIC secondary IP.
WORKER_PRIMARY_BASE=30
CONTROL_PLANE_PRIMARY_BASE=10

### ===== Kubelet Node IP Configuration =====
# Kubelet node IP configuration method
# The script will automatically configure kubelet to use the management VLAN IP
# (kubelet --node-ip = bond0.<MGMT_VLAN_ID> address).
# Method: Updates /etc/sysconfig/kubelet with KUBELET_EXTRA_ARGS="--node-ip=X.X.X.X"
KUBELET_AUTO_CONFIG="yes"
# Expected kubelet node IPs (calculated automatically from last hostname digit):
# - worker00:        10.40.4.30 (WORKER_PRIMARY_BASE + 0)
# - worker01:        10.40.4.31 (WORKER_PRIMARY_BASE + 1)
# - worker02:        10.40.4.32 (WORKER_PRIMARY_BASE + 2)
# - control-plane02: 10.40.4.12 (CONTROL_PLANE_PRIMARY_BASE + 2)

### ===== Advanced Configuration =====
# Whether to remove existing DHCP configuration on bond members
REMOVE_DHCP_ON_BOND_MEMBERS="yes"
# Enable verbose logging
VERBOSE_LOGGING="yes"
